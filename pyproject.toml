[project]
name = "campus-tycoon"
version = "0.1.0"
description = "A local campus cafe business simulation for learning programming."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "streamlit>=1.40,<2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
